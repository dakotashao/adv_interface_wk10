<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minerals — three ways in</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&display=swap" rel="stylesheet">
<style>
:root{--bg:#ebe9e3;--ink:#1c1b18;--mute:#767168;--faint:#b9b4a9;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden;font:400 13px/1.3 "Newsreader",serif;color:var(--ink);-webkit-font-smoothing:antialiased}
canvas#c{position:fixed;inset:0}
button{all:unset;cursor:pointer}
#top{position:fixed;left:0;right:0;top:22px;display:flex;justify-content:center;gap:12px;align-items:center;color:var(--faint);z-index:3}
#top button{color:var(--mute);font-style:italic;transition:color .2s} #top button:hover{color:var(--ink)} #top button:active{opacity:.5}
#top button.on{color:var(--ink);font-style:normal} #top button.on::before{content:'';display:inline-block;width:6px;height:6px;border:1px solid currentColor;border-radius:50%;margin:0 6px 1px 0}
#brand{position:fixed;left:26px;top:20px;z-index:3} #brand b{font-weight:400;font-size:17px;letter-spacing:.01em} #brand span{display:block;color:var(--mute);font-style:italic;margin-top:2px}
#card{position:fixed;right:24px;bottom:24px;width:300px;padding:6px 15px 14px;background:rgba(235,233,227,.94);z-index:4;opacity:0;transform:translateY(8px);transition:opacity .3s,transform .4s var(--ease);pointer-events:none}
#card.on{opacity:1;transform:none;pointer-events:auto}
#card canvas{display:block;width:270px;height:170px}
#card h2{font-weight:400;font-size:19px;margin-top:2px}
#card .hb{display:flex;gap:10px;margin:2px 0 8px;color:var(--mute);font-style:italic;flex-wrap:wrap} #card .hb button{color:var(--mute)} #card .hb button.on{color:var(--ink);font-style:normal} #card .hb button:hover{color:var(--ink)}
#card .r{display:flex;justify-content:space-between;gap:14px;padding:3px 0;color:var(--mute);border-top:1px solid rgba(28,27,24,.08)} #card .r span:last-child{color:var(--ink);text-align:right}
#card .sw{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px} #card .sw i{width:9px;height:9px;border-radius:50%;border:1px solid rgba(28,27,24,.25)}
#card .nt{color:var(--mute);font-style:italic;margin-top:8px;line-height:1.35}
#tip{position:fixed;pointer-events:none;z-index:5;white-space:nowrap;opacity:0;transition:opacity .15s;font-size:12px}
#tip b{font-weight:400} #tip span{color:var(--mute);font-style:italic}
#tool{position:fixed;z-index:3;display:none;transform:translate(-50%,0);text-align:center;white-space:nowrap;cursor:grab;user-select:none}
#tool .k{width:14px;height:14px;border:1px solid var(--ink);border-radius:50%;margin:0 auto 6px;background:var(--bg);position:relative}
#tool .k::after{content:'';position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--ink)}
#tool b{font-weight:400} #tool span{display:block;color:var(--mute);font-style:italic}
</style></head><body>
<canvas id="c"></canvas>
<div id="brand"><b>Minerals</b><span id="sub"></span></div>
<nav id="top"><button data-v="colour">Colour</button><span>·</span><button data-v="place">Place</button><span>·</span><button data-v="hard">Hardness</button></nav>
<div id="tip"></div><div id="tool"><div class="k"></div><b></b><span></span></div>
<div id="card"><canvas id="cc" width="540" height="340"></canvas><h2></h2><div class="hb"></div><div class="rows"></div><div class="nt"></div></div>
<script>
/* Three ways into the same 107 minerals. Every mineral is drawn as its own crystal: the faces come from its real crystal forms. */
const cv=document.getElementById('c'),g=cv.getContext('2d');let W,H,DPR;
function rs(){DPR=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';g.setTransform(DPR,0,0,DPR,0,0);lay()}
const INK='28,27,24',MUTE='118,113,104',FONT='"Newsreader", serif';
let D=[],LAND=[],view='colour',mx=-1,my=-1,hov=null,pin=null,T0=performance.now();
const ease=t=>1-Math.pow(1-Math.max(0,Math.min(1,t)),3);
function rgb(h){const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]}
/* ---------- one crystal ---------- */
function rot(v,rx,ry){const c=Math.cos(ry),s=Math.sin(ry),x=v[0]*c+v[2]*s,z=-v[0]*s+v[2]*c,c2=Math.cos(rx),s2=Math.sin(rx);return[x,v[1]*c2-z*s2,v[1]*s2+z*c2]}
// draw a crystal from already-transformed points P (screen x, screen y, depth); faces painted back to front
function paint(ctx,P,F,col,al,lw,dash){const [r,gg,b]=rgb(col);const fs=F.map(f=>{let z=0;f.forEach(i=>z+=P[i][2]);return[z/f.length,f]}).sort((a,b)=>a[0]-b[0]);
  fs.forEach(([z,f])=>{const a=P[f[0]],b1=P[f[1]],c=P[f[2]];const nx=(b1[1]-a[1])*(c[2]-a[2])-(b1[2]-a[2])*(c[1]-a[1]),ny=(b1[2]-a[2])*(c[0]-a[0])-(b1[0]-a[0])*(c[2]-a[2]),nz=(b1[0]-a[0])*(c[1]-a[1])-(b1[1]-a[1])*(c[0]-a[0]);
    const L=Math.hypot(nx,ny,nz)||1,sh=.62+.38*Math.abs((-.45*nx-.6*ny+.66*nz)/L);
    ctx.beginPath();f.forEach((i,k)=>k?ctx.lineTo(P[i][0],P[i][1]):ctx.moveTo(P[i][0],P[i][1]));ctx.closePath();
    ctx.fillStyle=`rgba(${r*sh|0},${gg*sh|0},${b*sh|0},${al*.82})`;ctx.fill();ctx.strokeStyle=`rgba(${INK},${al*.55})`;ctx.lineWidth=lw||.7;ctx.stroke()})}
function glyph(ctx,m,hab,x,y,s,col,al,rx,ry){const h=m.habits[hab||0];const P=h.V.map(v=>{const q=rot(v,rx,ry);return[x+q[0]*s,y+q[1]*s,q[2]]});paint(ctx,P,h.F,col,al);return P}

/* ---------- the card: the held mineral turns slowly, its back edges dashed ---------- */
const card=document.getElementById('card'),cc=document.getElementById('cc'),cx=cc.getContext('2d');let cardM=null,cardHab=0,cardCol=null;
function showCard(m,col){if(cardM!==m){cardM=m;cardHab=0}cardCol=col||m.colors[0].hex;card.classList.add('on');
  card.querySelector('h2').textContent=m.n;
  card.querySelector('.hb').innerHTML=m.habits.map((h,i)=>`<button data-i="${i}" class="${i===cardHab?'on':''}">${h.l.split(/ with | and |,/)[0].toLowerCase()}</button>`).join('');
  card.querySelectorAll('.hb button').forEach(b=>b.onclick=()=>{cardHab=+b.dataset.i;showCard(m,cardCol)});
  card.querySelector('.rows').innerHTML=`<div class="r"><span>Colour</span><span><span class="sw">${m.colors.map(c=>`<i style="background:${c.hex}"></i>`).join('')}</span>${m.colors[0].c.toLowerCase()}${m.colors.length>1?' …':''}</span></div>
    <div class="r"><span>Hardness</span><span>Mohs ${m.h}</span></div><div class="r"><span>Crystal</span><span>${m.sys}</span></div>
    <div class="r"><span>Found in</span><span>${m.loc.slice(0,3).map(l=>l.n).join(', ')}${m.loc.length>3?' +'+(m.loc.length-3):''}</span></div><div class="r"><span>Formula</span><span>${m.chem}</span></div>`;
  card.querySelector('.nt').textContent=(m.note||m.desc).split(/(?<=\.)\s/)[0]}
function hideCard(){if(!pin){card.classList.remove('on');cardM=null}}
function drawCard(t){if(!cardM)return;cx.setTransform(2,0,0,2,0,0);cx.clearRect(0,0,270,170);const h=cardM.habits[cardHab],ry=t/2600,rx=-.38,s=62;
  const P=h.V.map(v=>{const q=rot(v,rx,ry);return[135+q[0]*s,86+q[1]*s,q[2]]});
  // hidden edges dashed, then the faces you can see
  cx.setLineDash([2,3]);cx.strokeStyle=`rgba(${INK},.35)`;cx.lineWidth=.8;h.F.forEach(f=>{cx.beginPath();f.forEach((i,k)=>k?cx.lineTo(P[i][0],P[i][1]):cx.moveTo(P[i][0],P[i][1]));cx.closePath();cx.stroke()});cx.setLineDash([]);
  paint(cx,P,h.F,cardCol,.9,.9)}

/* ---------- A · Colour: white light goes into a prism and fans out; each mineral sits on the ray of its colour ---------- */
const RAYS=[{k:'red',h:['#b8322f'],c:'#b8322f'},{k:'orange',h:['#e0782f','#c98a2b'],c:'#e0782f'},{k:'yellow',h:['#e2c13b','#c9a63a','#c4a43c'],c:'#e2c13b'},{k:'yellow-green',h:['#9aab3c','#8a8f3a'],c:'#9aab3c'},
  {k:'green',h:['#3f8a4c'],c:'#3f8a4c'},{k:'blue-green',h:['#3b9a93','#3b8fa0','#3aa3a0','#3aa3b0'],c:'#3b9a93'},{k:'blue',h:['#3b63b4'],c:'#3b63b4'},{k:'violet',h:['#7a4d9f','#a68cc4'],c:'#7a4d9f'}];
const OFF=[{k:'pink',h:['#e29aae'],c:'#e29aae',why:'not in the rainbow'},{k:'brown',h:['#7b5335','#9a7a3a'],c:'#7b5335',why:'not in the rainbow'}];
const CLEAR=['#dfe6e8','#f1efe8'],DARK=['#2b2926','#97958f','#a9adb2','#8d9298'];
let A=null;
function layColour(){const px=W*.24,py=H*.47,ps=Math.min(W,H)*.13,fan=[];const x1=W-(W>1100?330:150);
  const all=[...RAYS.map((r,i)=>({...r,a:-.28+i*(.52/(RAYS.length-1))})),...OFF.map((r,i)=>({...r,a:.36+i*.08,off:1}))];
  all.forEach(r=>{const it=[];D.forEach(m=>m.colors.forEach(c=>{if(r.h.includes(c.hex))it.push({m,col:c.hex,cn:c.c})}));it.sort((a,b)=>a.m.h-b.m.h);r.it=it});
  const clear=[],dark=[];D.forEach(m=>m.colors.forEach(c=>{if(CLEAR.includes(c.hex))clear.push({m,col:c.hex,cn:c.c});if(DARK.includes(c.hex))dark.push({m,col:c.hex,cn:c.c})}));
  A={px,py,ps,rays:all,clear,dark,x1}}
function drawColour(t){const {px,py,ps}=A;const k=ease((t-T0)/1600);
  // the prism: a glass triangle turning a little
  const tri=[[0,-1.05,0],[.95,.6,0],[-.95,.6,0]].map(v=>[v[0]*ps,v[1]*ps]);const depth=ps*.55,ry=Math.sin(t/4000)*.25;
  const pt=(v,z)=>{const q=rot([v[0],v[1],z],-.18,ry);return[px+q[0],py+q[1],q[2]]};
  const F=tri.map(v=>pt(v,-depth/2)),B=tri.map(v=>pt(v,depth/2));g.lineWidth=1;
  [[F,1],[B,.35]].forEach(([Q,al])=>{g.strokeStyle=`rgba(${INK},${al*.7})`;g.beginPath();Q.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.stroke()});
  for(let i=0;i<3;i++){g.strokeStyle=`rgba(${INK},.35)`;g.beginPath();g.moveTo(F[i][0],F[i][1]);g.lineTo(B[i][0],B[i][1]);g.stroke()}
  g.fillStyle='rgba(255,255,255,.25)';g.beginPath();F.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.fill();
  // white light in
  const inA=[0,py-ps*.15],hit=[(F[0][0]+F[2][0])/2,(F[0][1]+F[2][1])/2+ps*.05],out=[(F[0][0]+F[1][0])/2+4,(F[0][1]+F[1][1])/2+ps*.1];
  g.strokeStyle=`rgba(${INK},.7)`;g.lineWidth=1.4;g.beginPath();g.moveTo(inA[0],inA[1]);g.lineTo(hit[0],hit[1]);g.stroke();g.lineWidth=1;
  g.strokeStyle=`rgba(${INK},.25)`;g.beginPath();g.moveTo(hit[0],hit[1]);g.lineTo(out[0],out[1]);g.stroke();
  lab(14,inA[1]-10,'white light',MUTE,1,'italic 12px');
  const hm=hov&&hov.m,rays=A.rays,len=A.x1-out[0];let hits=[];
  rays.forEach(r=>{const ex=out[0]+Math.cos(r.a)*len*k,ey=out[1]+Math.sin(r.a)*len*k*1.0,on=hovRay===r;
    const [cr,cg,cb]=rgb(r.c);g.strokeStyle=`rgba(${cr},${cg},${cb},${r.off?.28:on?.9:.5})`;g.lineWidth=on?1.6:1;if(r.off)g.setLineDash([3,4]);g.beginPath();g.moveTo(out[0],out[1]);g.lineTo(ex,ey);g.stroke();g.setLineDash([]);g.lineWidth=1;
    r.ex=ex;r.ey=ey;r.ox=out[0];r.oy=out[1];
    const n=r.it.length;r.it.forEach((it,i)=>{const u=.24+.74*(i+.5)/n,zig=(i%2?1:-1)*Math.min(9,len*.012),x=out[0]+Math.cos(r.a)*len*u*k-Math.sin(r.a)*zig,y=out[1]+Math.sin(r.a)*len*u*k+Math.cos(r.a)*zig;
      const same=hm===it.m,al=hm?(same?1:.22):(hovRay&&hovRay!==r?.35:1),s=same?10:on?8:6.2;
      glyph(g,it.m,0,x,y,s,it.col,al*k,-.4,t/3000+i);it.x=x;it.y=y;hits.push([x,y,9,it])});
    lab(ex+8,ey+4,`${r.k}  ×${n}`+(r.off?'  · '+r.why:''),r.off?MUTE:INK,(on?1:.75)*k,(r.off?'italic ':'')+'12px')});
  // colourless minerals let the light straight through; the dark ones lie in the prism's shadow
  const sx=out[0]+12,sy=out[1]-ps*.75;lab(px-ps*.9,py+ps*1.35,'black, grey, metal · they take the light in',MUTE,.8*k,'italic 12px');
  A.dark.forEach((it,i)=>{const col=i%14,row=i/14|0,x=px-ps*.9+col*16,y=py+ps*1.12-row*15;const same=hm===it.m,al=hm?(same?1:.22):1;glyph(g,it.m,0,x,y,same?9:6,it.col,al*k,-.4,t/3000+i);it.x=x;it.y=y;hits.push([x,y,8,it])});
  lab(px-ps*.9,py-ps*1.55,'colourless, white · the light goes straight through',MUTE,.8*k,'italic 12px');
  A.clear.forEach((it,i)=>{const col=i%17,row=i/17|0,x=px-ps*.9+col*15,y=py-ps*1.35+row*15;const same=hm===it.m,al=hm?(same?1:.22):1;glyph(g,it.m,0,x,y,same?9:5.6,it.col,al*k,-.4,t/3000+i);it.x=x;it.y=y;hits.push([x,y,8,it])});
  // pointing at one mineral threads all of its colours together
  if(hm){const pts=hits.filter(h=>h[3].m===hm).map(h=>h);g.strokeStyle=`rgba(${INK},.5)`;g.setLineDash([2,3]);g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();g.setLineDash([]);
    if(pts.length>1)lab(pts[pts.length-1][0]+12,pts[pts.length-1][1]-10,`${hm.n} comes in ${pts.length} colours`,INK,1,'italic 12px')}
  HITS=hits}
let hovRay=null;
function rayAt(x,y){if(view!=='colour'||!A)return null;let best=null,bd=10;A.rays.forEach(r=>{const dx=r.ex-r.ox,dy=r.ey-r.oy,L2=dx*dx+dy*dy,u=((x-r.ox)*dx+(y-r.oy)*dy)/L2;if(u<.1||u>1.05)return;const d=Math.abs((x-r.ox)*dy-(y-r.oy)*dx)/Math.sqrt(L2);if(d<bd){bd=d;best=r}});return best}

/* ---------- D · Place: a druse planet. Each mineral grows out of the ground where it is found, its long axis pointing away from the centre ---------- */
let G={lon:-20,lat:-28,vl:0,va:0,drag:false};
const ll2v=(lat,lon)=>{const a=lat*Math.PI/180,o=lon*Math.PI/180;return[Math.cos(a)*Math.sin(o),-Math.sin(a),Math.cos(a)*Math.cos(o)]};
let PL=null;
function layPlace(){const by={};D.forEach(m=>m.loc.forEach(l=>{(by[l.n]=by[l.n]||{n:l.n,lat:l.lat,lon:l.lon,ms:[]}).ms.push(m)}));PL=Object.values(by)}
function gview(v){const a=G.lon*Math.PI/180,b=G.lat*Math.PI/180;let x=v[0]*Math.cos(a)-v[2]*Math.sin(a),z=v[0]*Math.sin(a)+v[2]*Math.cos(a),y=v[1];const y2=y*Math.cos(b)-z*Math.sin(b),z2=y*Math.sin(b)+z*Math.cos(b);return[x,y2,z2]}
function drawPlace(t){const R=Math.min(W,H)*.32,cx0=W/2,cy0=H/2+14,k=ease((t-T0)/1400);
  if(!G.drag){G.lon+=G.vl;G.lat=Math.max(-60,Math.min(60,G.lat+G.va));G.vl=G.vl*.95+(hov?0:.05)*.05;G.va*=.92}
  g.strokeStyle=`rgba(${INK},.5)`;g.lineWidth=1;g.beginPath();g.arc(cx0,cy0,R,0,7);g.stroke();
  // graticule, then the coastlines; only the near side
  const pr=v=>{const q=gview(v);return[cx0+q[0]*R,cy0+q[1]*R,q[2]]};
  g.strokeStyle=`rgba(${INK},.08)`;for(let lo=-180;lo<180;lo+=30){g.beginPath();let pen=0;for(let la=-90;la<=90;la+=5){const p=pr(ll2v(la,lo));if(p[2]>0){pen?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]);pen=1}else pen=0}g.stroke()}
  for(let la=-60;la<=60;la+=30){g.beginPath();let pen=0;for(let lo=-180;lo<=180;lo+=5){const p=pr(ll2v(la,lo));if(p[2]>0){pen?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]);pen=1}else pen=0}g.stroke()}
  g.strokeStyle=`rgba(${INK},.42)`;LAND.forEach(ring=>{g.beginPath();let pen=0;ring.forEach(([lo,la])=>{const p=pr(ll2v(la,lo));if(p[2]>0){pen?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]);pen=1}else pen=0});g.stroke()});
  // the crystals: a sunflower of them at each place, standing up out of the surface
  const s=R*.028*k,hits=[],list=[];
  PL.forEach(pl=>{const u=ll2v(pl.lat,pl.lon),q=gview(u);if(q[2]<-.05)return;
    let e1=[u[2],0,-u[0]];const l1=Math.hypot(...e1)||1;e1=e1.map(x=>x/l1);const e2=[u[1]*e1[2]-u[2]*e1[1],u[2]*e1[0]-u[0]*e1[2],u[0]*e1[1]-u[1]*e1[0]];
    const n=pl.ms.length,hp=hovPlace===pl;pl.sx=cx0+q[0]*R;pl.sy=cy0+q[1]*R;pl.sz=q[2];
    pl.ms.forEach((m,i)=>{const r=Math.sqrt(i+.5)*.021,ang=i*2.39996,lift=1+.018+.05*(1-Math.sqrt(i/Math.max(1,n)))*(n>4?1:.3);
      const base=[0,1,2].map(j=>u[j]*lift+(e1[j]*Math.cos(ang)+e2[j]*Math.sin(ang))*r);
      list.push({pl,m,base,u,e1,e2,z:gview(base)[2],i})})});
  list.sort((a,b)=>a.z-b.z);
  list.forEach(o=>{const {m,base,u,e1,e2,pl}=o,h=m.habits[0],sz=s*(hov&&hov.m===m?1.6:1),spin=t/5000+o.i;
    const P=h.V.map(v=>{const c=Math.cos(spin),sn=Math.sin(spin),x=v[0]*c+v[2]*sn,z=-v[0]*sn+v[2]*c,y=v[1];   // turn about its own c axis, then stand it on the ground
      const w=[0,1,2].map(j=>base[j]*R+(e1[j]*x+(-y)*u[j]+e2[j]*z)*sz*(j===1?1:1)+u[j]*sz*.9);const q=gview(w);return[cx0+q[0],cy0+q[1],q[2]]});
    const al=(hov?(hov.m===m?1:.3):hovPlace?(hovPlace===pl?1:.35):1)*Math.min(1,(o.z+.05)*6);
    paint(g,P,h.F,m.colors[0].hex,al,.6);const c=gview(base.map(x=>x*R));hits.push([cx0+c[0],cy0+c[1],7,{m,col:m.colors[0].hex,pl}])});
  if(hovPlace&&hovPlace.sz>0)lab(hovPlace.sx+18,hovPlace.sy-16,`${hovPlace.n}  ×${hovPlace.ms.length}`,INK,1,'14px');
  if(hov&&hov.pl)lab(hov.pl.sx+18,hov.pl.sy-16,hov.pl.n,MUTE,1,'italic 12px');
  lab(cx0,cy0+R+38,'drag to turn the earth',MUTE,.6,'italic 12px','center');HITS=hits}
let hovPlace=null;

/* ---------- C · Hardness: the minerals stand in columns over the Mohs scale; drag the tool and everything softer than it gets scratched ---------- */
const MOHS=['talc','gypsum','calcite','fluorite','apatite','orthoclase','quartz','topaz','corundum','diamond'];
const TOOLS=[[2.5,'fingernail'],[3.5,'copper coin'],[5.5,'steel knife · glass'],[6.5,'steel file'],[7,'quartz'],[8,'topaz'],[9,'corundum'],[10,'diamond']];
let HC=null,toolH=5.5,toolT=5.5;
function layHard(){const x0=110,x1=W-110,y0=H-150,cols={};D.forEach(m=>{const k=Math.round(m.h*2)/2;(cols[k]=cols[k]||[]).push(m)});
  const mxN=Math.max(...Object.values(cols).map(c=>c.length)),step=Math.min(26,(y0-130)/mxN);
  HC={x0,x1,y0,step,X:h=>x0+(h-1)/9*(x1-x0),items:[]};
  Object.entries(cols).forEach(([k,ms])=>ms.sort((a,b)=>a.n.localeCompare(b.n)).forEach((m,i)=>HC.items.push({m,h:+k,i,y:-200-Math.random()*600,v:0,sc:0})));placeTool()}
function placeTool(){const el=document.getElementById('tool');if(!HC)return;el.style.left=HC.X(toolH)+'px';el.style.top=(HC.y0+76)+'px';
  const nt=TOOLS.reduce((a,b)=>Math.abs(b[0]-toolH)<Math.abs(a[0]-toolH)?b:a);el.querySelector('b').textContent=nt[1];
  const n=HC.items.filter(o=>o.m.h<toolH).length;el.querySelector('span').textContent=`${toolH.toFixed(1)} · scratches ${n} of ${D.length}`}
function drawHard(t){const {x0,x1,y0,step,X}=HC;{const tx=X(toolH);g.strokeStyle=`rgba(${INK},.35)`;g.beginPath();g.moveTo(tx,y0);g.lineTo(tx,y0+76);g.stroke()}toolH+=(toolT-toolH)*.2;placeTool();
  g.strokeStyle=`rgba(${INK},.6)`;g.lineWidth=1;g.beginPath();g.moveTo(x0-20,y0);g.lineTo(x1+20,y0);g.stroke();
  for(let h=1;h<=10;h++){const x=X(h);g.beginPath();g.moveTo(x,y0);g.lineTo(x,y0+6);g.stroke();lab(x,y0+44+(h%2?0:0),String(h),INK,.9,'13px','center');lab(x,y0+60,MOHS[h-1],MUTE,.8,'italic 11px','center')}
  // the scratch line runs up from the tool through every column
  const tx=X(toolH);g.strokeStyle=`rgba(${INK},.35)`;g.setLineDash([2,4]);g.beginPath();g.moveTo(tx,y0);g.lineTo(tx,90);g.stroke();g.setLineDash([]);
  const hits=[];
  HC.items.forEach((o,k)=>{const ty=y0-12-o.i*step;o.v+=(ty-o.y)*.06;o.v*=.78;if(t-T0>k*12)o.y+=o.v;   // they drop in and settle like stones
    const x=X(o.h)+(o.i%2?3:-3),soft=o.m.h<toolH-.01,hard=o.m.h>toolH+.01;o.sc+=((soft?1:0)-o.sc)*.12;
    const al=hov?(hov.m===o.m?1:.3):1-.35*o.sc,s=Math.min(11,step*.48)*(hov&&hov.m===o.m?1.5:1);
    glyph(g,o.m,0,x,o.y,s,o.m.colors[0].hex,al,-.35,t/4000+k*.7);
    if(o.sc>.02){g.strokeStyle=`rgba(${INK},${.8*o.sc*al})`;g.lineWidth=1;g.beginPath();g.moveTo(x-s*1.2,o.y+s*.5);g.lineTo(x-s*1.2+s*2.4*o.sc,o.y+s*.5-s*1.0*o.sc);g.stroke()}   // a scratch drawn across it
    if(hard&&Math.abs(o.m.h-toolH)<1.6){const tw=(Math.sin(t/300+k)+1)/2;g.strokeStyle=`rgba(${INK},${.5*tw})`;g.beginPath();g.moveTo(x+s,o.y-s-3);g.lineTo(x+s,o.y-s+3);g.moveTo(x+s-3,o.y-s);g.lineTo(x+s+3,o.y-s);g.stroke()}   // the ones just harder than the tool glint
    hits.push([x,o.y,s+2,{m:o.m,col:o.m.colors[0].hex}])});
  HITS=hits}
const toolEl=document.getElementById('tool');let tDrag=false;
toolEl.addEventListener('pointerdown',e=>{tDrag=true;toolEl.setPointerCapture(e.pointerId);toolEl.style.cursor='grabbing'});
toolEl.addEventListener('pointermove',e=>{if(!tDrag)return;toolT=Math.max(1,Math.min(10,1+(e.clientX-HC.x0)/(HC.x1-HC.x0)*9))});
toolEl.addEventListener('pointerup',()=>{tDrag=false;toolEl.style.cursor='grab';const nt=TOOLS.reduce((a,b)=>Math.abs(b[0]-toolT)<Math.abs(a[0]-toolT)?b:a);if(Math.abs(nt[0]-toolT)<.35)toolT=nt[0]});   // lets go onto the nearest everyday tool

/* ---------- shared ---------- */
let HITS=[];
function lab(x,y,s,c,a,f,al){g.globalAlpha=a;g.fillStyle=`rgb(${c})`;g.font=`${f||'12px'} ${FONT}`;g.textAlign=al||'left';g.fillText(s,x,y);g.textAlign='left';g.globalAlpha=1}
function lay(){if(!D.length)return;layColour();layPlace();layHard()}
function setView(v){view=v;T0=performance.now();hov=null;pin=null;hideCard();document.querySelectorAll('#top button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  toolEl.style.display=v==='hard'?'block':'none';if(v==='hard')layHard();
  document.getElementById('sub').textContent={colour:`${D.length} minerals, by the colour they show`,place:`${D.length} minerals, where they are found`,hard:`${D.length} minerals, from soft to hard`}[v];
  try{history.replaceState(null,'','#'+v)}catch(e){}}
document.querySelectorAll('#top button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
const tip=document.getElementById('tip');
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;
  if(G.drag){G.vl=(e.clientX-G.x)*.25;G.va=(e.clientY-G.y)*.2;G.lon+=G.vl;G.lat=Math.max(-60,Math.min(60,G.lat+G.va));G.x=e.clientX;G.y=e.clientY;return}
  let best=null,bd=1e9;HITS.forEach(h=>{const d=Math.hypot(h[0]-mx,h[1]-my);if(d<h[2]+3&&d<bd){bd=d;best=h[3]}});hov=best;
  hovRay=!best?rayAt(mx,my):null;
  hovPlace=null;if(view==='place'&&!best&&PL){let b2=null,d2=22;PL.forEach(p=>{if(p.sz>0){const d=Math.hypot(p.sx-mx,p.sy-my);if(d<d2){d2=d;b2=p}}});hovPlace=b2}
  if(best){showCard(best.m,best.col);tip.style.opacity=1;tip.style.left=(mx+14)+'px';tip.style.top=(my-24)+'px';tip.innerHTML=`<b>${best.m.n}</b>  <span>${best.cn?best.cn.toLowerCase():'Mohs '+best.m.h}</span>`}
  else{tip.style.opacity=0;if(!pin)hideCard()}
  cv.style.cursor=best?'pointer':view==='place'?'grab':'default'});
cv.addEventListener('pointerdown',e=>{if(hov){pin=pin&&pin.m===hov.m?null:hov;if(pin)showCard(hov.m,hov.col);return}pin=null;hideCard();if(view==='place'){G.drag=true;G.x=e.clientX;G.y=e.clientY;cv.setPointerCapture(e.pointerId)}});
addEventListener('pointerup',()=>{G.drag=false});
card.addEventListener('pointerleave',()=>{if(!pin)hideCard()});
function loop(t){g.clearRect(0,0,W,H);if(D.length){if(view==='colour')drawColour(t);else if(view==='place')drawPlace(t);else drawHard(t);drawCard(t)}requestAnimationFrame(loop)}
Promise.all([fetch('minerals.json').then(r=>r.json()),fetch('land.json').then(r=>r.json())]).then(([d,l])=>{D=d;LAND=l;addEventListener('resize',rs);rs();setView(['colour','place','hard'].includes(location.hash.slice(1))?location.hash.slice(1):'colour');requestAnimationFrame(loop)});
</script></body></html>
