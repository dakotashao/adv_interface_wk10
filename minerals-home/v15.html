  ctx.lineWidth=(lw||1)*.6;edges(h).forEach(e=>{const f1=front[e[2]],f2=front[e[3]];if(!f1&&!f2)return;ctx.strokeStyle=`rgba(${INK},${al*(f1!==f2?.6:.42)})`;ctx.beginPath();ctx.moveTo(P[e[0]][0],P[e[0]][1]);ctx.lineTo(P[e[1]][0],P[e[1]][1]);ctx.stroke()})}

const REF=[['Fingernail',2.5],['Copper coin',3.5],['Glass',5.5],['Steel knife',5.5],['Steel file',6.5],['Streak plate',6.5],['Quartz',7],['Topaz',8],['Corundum',9]];

let CAB=store('mn-cab')||[],NOTES=store('mn-notes')||{},TOOL=null,ZOOM=1.8,REFI=2;
const toolsEl=document.getElementById('tools'),pane=document.getElementById('pane'),zoomEl=document.getElementById('zoom'),noteEl=document.getElementById('note'),cmpEl=document.getElementById('cmp');
function setTool(k){TOOL=TOOL===k?null:k;toolsEl.querySelectorAll('button').forEach(b=>{if(b.dataset.k!=='collect')b.classList.toggle('on',b.dataset.k===TOOL)});

  cmpEl.querySelector('ul').innerHTML=REF.map(([n,h],i)=>`<li data-i="${i}" class="${i===REFI?'on':''}"><span>${n}</span><span>${h}</span></li>`).join('');
  cmpEl.querySelectorAll('li').forEach(li=>li.onclick=e=>{e.stopPropagation();REFI=+li.dataset.i;cmpEl.querySelector('.menu').classList.remove('open');pane.style.overflow='';verdict()})}

  else{const fam=Object.values(FAM).filter(ns=>ns.includes(m.n)).flat(),near=D.filter(x=>x!==m&&isMet(x)===isMet(m)&&CF(x.colors[0].hex)===CF(m.colors[0].hex)&&Math.abs(x.h-m.h)<=.5);
    L=[...new Set([...fam.map(n=>D.find(x=>x.n===n)),...near])].filter(x=>x&&x!==m)}
  sug.innerHTML=(q?'':'<span style="color:var(--mute);font-style:italic">looks similar</span>')+L.slice(0,6).map(x=>`<button data-n="${x.n}">${x.n}</button>`).join('');
  sug.querySelectorAll('button').forEach(b=>b.onclick=()=>{SP.vs=D.find(x=>x.n===b.dataset.n);vsq.value='';setTool('vs');spRows()})}

zoomEl.oninput=()=>{ZOOM=+zoomEl.value;pane.querySelector('.zv').textContent=ZOOM.toFixed(1)+'×'};
let noteT=null;noteEl.oninput=()=>{const sv=pane.querySelector('.sv');sv.classList.remove('on');clearTimeout(noteT);noteT=setTimeout(()=>{NOTES[SP.m.n]=noteEl.value;store('mn-notes',NOTES);sv.classList.add('on')},500)};
noteEl.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter'){NOTES[SP.m.n]=noteEl.value;store('mn-notes',NOTES);pane.querySelector('.sv').classList.add('on');noteEl.blur()}};
const FAM={feldspar:['Orthoclase','Microcline','Sanidine','Plagioclase'],garnet:['Almandine','Pyrope','Spessartine','Grossular','Andradite','Uvarovite'],tourmaline:['Schorl','Dravite','Elbaite'],
  mica:['Muscovite','Biotite'],amphibole:['Hornblende','Actinolite','Tremolite'],pyroxene:['Augite','Diopside','Enstatite','Jadeite','Spodumene'],jade:['Jadeite','Tremolite'],
  carbonate:['Calcite','Aragonite','Dolomite','Malachite','Azurite','Rhodochrosite'],'lapis lazuli':['Lazurite'],sphene:['Titanite'],peridot:['Olivine'],'fool’s gold':['Pyrite'],'fools gold':['Pyrite'],salt:['Halite'],
  ruby:['Corundum'],sapphire:['Corundum'],emerald:['Beryl'],aquamarine:['Beryl'],amethyst:['Quartz'],citrine:['Quartz'],tanzanite:['Zoisite'],amazonite:['Microcline'],labradorite:['Plagioclase'],sunstone:['Plagioclase'],moonstone:['Orthoclase'],
  serpentine:['Serpentine'],silica:['Quartz'],'iron ore':['Hematite','Magnetite'],'copper':['Malachite','Azurite','Cuprite','Turquoise'],'lead':['Galena','Wulfenite','Crocoite'],'arsenic':['Realgar','Orpiment']};
const qEl=document.getElementById('q'),findEl=document.getElementById('find');let QR=[],QI=0;
function search(q){q=q.trim().toLowerCase();if(!q)return[];const R=[],seen=new Set(),add=(m,why,sc)=>{if(m&&!seen.has(m.n)){seen.add(m.n);R.push({m,why,sc})}};
  D.forEach(m=>{const n=m.n.toLowerCase();if(n.startsWith(q))add(m,'Mohs '+hr(m),0);else if(n.includes(q))add(m,'Mohs '+hr(m),1)});
  D.forEach(m=>(m.var||[]).forEach(v=>{if(v.toLowerCase().includes(q))add(m,v.toLowerCase()+' is a variety',2)}));
  Object.entries(FAM).forEach(([f,ns])=>{if(f.includes(q)||q.includes(f))ns.forEach(n=>add(D.find(m=>m.n===n),f,3))});
  D.forEach(m=>{if((m.env||[]).some(e=>e.includes(q)))add(m,'forms in '+m.env.find(e=>e.includes(q)),4);if(m.loc.some(l=>l.n.toLowerCase().startsWith(q)))add(m,'found in '+m.loc.find(l=>l.n.toLowerCase().startsWith(q)).n,5)});
  const P=(PL||[]).filter(p=>p.n.toLowerCase().startsWith(q)).slice(0,3).map(p=>({pl:p,why:`place · ${p.ms.length} minerals`,sc:-1}));
  const cf=CFAM.find(([n])=>n.split(' / ')[0]===q||n===q);const C=cf?[{cf:cf[0],why:'show only this colour',sc:-2}]:[];
  return C.concat(P,R.sort((a,b)=>a.sc-b.sc)).slice(0,8)}
function drawFind(){const ul=findEl.querySelector('ul');findEl.classList.toggle('open',!!qEl.value.trim()&&document.activeElement===qEl);
  ul.innerHTML=QR.length?QR.map((r,i)=>`<li data-i="${i}" class="${i===QI?'on':''}"><b>${r.m?r.m.n:r.pl?r.pl.n:r.cf+' stones'}</b><span>${r.why}</span></li>`).join(''):`<div class="none">nothing by that name</div>`;
  ul.querySelectorAll('li').forEach(li=>li.onmousedown=e=>{e.preventDefault();pick(QR[+li.dataset.i])})}
qEl.oninput=()=>{QR=search(qEl.value);QI=0;drawFind()};qEl.onfocus=drawFind;qEl.onblur=()=>setTimeout(drawFind,0);
qEl.onkeydown=e=>{e.stopPropagation();if(e.key==='ArrowDown'){QI=Math.min(QR.length-1,QI+1);drawFind();e.preventDefault()}else if(e.key==='ArrowUp'){QI=Math.max(0,QI-1);drawFind();e.preventDefault()}

const LOAD0=performance.now();let LOADEND=null;
const LQ=(()=>{const V=[],E=[];for(let i=0;i<6;i++){const a=i*Math.PI/3;V.push([Math.cos(a)*.62,-.55,Math.sin(a)*.62]);}for(let i=0;i<6;i++){const a=i*Math.PI/3;V.push([Math.cos(a)*.62,.55,Math.sin(a)*.62]);}V.push([0,-1.25,0],[0,1.15,0]);
  for(let i=0;i<6;i++)E.push([12,i]);for(let i=0;i<6;i++)E.push([i,(i+1)%6]);for(let i=0;i<6;i++)E.push([i,i+6]);for(let i=0;i<6;i++)E.push([i+6,(i+1)%6+6]);for(let i=0;i<6;i++)E.push([13,i+6]);return{V,E}})();
function drawLoader(t){const lt=t-LOAD0,out=LOADEND?Math.min(1,(t-LOADEND)/500):0,al=1-out;if(al<=0)return;g.fillStyle=`rgba(235,233,227,${al})`;g.fillRect(0,0,W,H);

  lab(cx,cy+92,'Minerals',INK,al,'17px','center');lab(cx,cy+112,'drawing the crystals…',MUTE,.8*al,'italic 12px','center')}

const CFAM=[['red','#b8322f'],['pink','#e29aae'],['orange','#e0782f'],['yellow','#e2c13b'],['green','#3f8a4c'],['blue-green','#3b9a93'],['blue','#3b63b4'],['violet','#7a4d9f'],['brown','#7b5335'],['white / colourless','#f1efe8'],['grey','#97958f'],['black','#2b2926']];
function CF(hex){const {h,s,v}=hsv(hex);if(s<.18)return v>.8?'white / colourless':v<.3?'black':'grey';if(h>=12&&h<48&&v<.62)return 'brown';
  return h<12||h>=350?'red':h<45?'orange':h<64?'yellow':h<165?'green':h<200?'blue-green':h<255?'blue':h<300?'violet':'pink'}

const STS=['white','black / grey','red-brown','pale brown','yellow / orange','green','blue'],CLS=['none or poor','1 direction','2 directions','3 or more'];

/* ================= v15 · one pile of crystals, three ways to lay it out ================= */
let ARR='colour',SHELF=false,O=[],HL=null,HLt=0,PL=[],hovO=null,press=null,RD=null,HD=null,GT=null,SHY={v:0,c:0,max:0};
const SEL={hue:null,neu:false,places:new Set(),lo:1,hi:10};

const AX={c:1.2,t:2.2};
const FAMH={red:[350,12],orange:[12,45],yellow:[45,64],green:[64,165],'blue-green':[165,200],blue:[200,255],violet:[255,300],pink:[300,350],brown:[12,48]};
const hueName=h=>{h=(h+360)%360;return h<12||h>=350?'red':h<45?'orange':h<64?'yellow':h<165?'green':h<200?'blue-green':h<255?'blue':h<300?'violet':'pink'};
const hueIn=h=>{if(!SEL.hue)return false;const [a,b]=SEL.hue,d=(h-a+360)%360,sp=(b-a+360)%360;return d<=sp};
const selOn=()=>!!(SEL.hue||SEL.neu||SEL.places.size||SEL.lo>1||SEL.hi<10||CL.st.size||CL.cl.size||CL.env.size||CL.met||CL.acid);
function fit(m){
  if(SEL.hue||SEL.neu){if(!m.colors.some(c=>{const v=hsv(c.hex);return v.s<.18?SEL.neu:hueIn(v.h)}))return false}
  if(SEL.places.size&&!m.loc.some(l=>SEL.places.has(l.n)))return false;
  const [a,b]=m.hr||[m.h,m.h];if(SEL.lo>1&&a<SEL.lo)return false;if(SEL.hi<10&&b>SEL.hi)return false;
  if(CL.st.size&&!CL.st.has(STF(m.st)))return false;if(CL.cl.size&&!CL.cl.has(CLS[m.cc||0]))return false;
  if(CL.env.size&&!(m.env||[]).some(e=>CL.env.has(e)))return false;
  if(CL.met==='metallic'&&!isMet(m))return false;if(CL.met==='non-metallic'&&isMet(m))return false;if(CL.acid&&!m.acid)return false;return true}
const FA=m=>!selOn()||fit(m)?1:.09;

/* ---------- layouts: each one only sets targets; the crystals glide to them ---------- */
let CG=null;
function layColour(){const cx0=W/2,cy0=H/2+30,R=Math.min(W*.4,H*.36);CG={cx0,cy0,R};
  const pos=(hex,j)=>{const v=hsv(hex);if(v.s<.18)return null;const a=(v.h-90)*Math.PI/180,r=R*(.5+.42*v.s)+((j||0)%3-1)*5;return[cx0+Math.cos(a)*r,cy0+Math.sin(a)*r]};
  const neu=[];O.forEach(o=>{const p=pos(o.m.colors[0].hex);if(p){o.cx=p[0];o.cy=p[1]}else neu.push(o);

let FLASHP=null,FLASHT=0;
function drawSpec(t){const m=SP.m,sk=ease((t-SP.t0)/750);g.fillStyle=`rgba(235,233,227,${.95*sk})`;g.fillRect(0,0,W,H);
  const pl=spEl.getBoundingClientRect().left-24,fs=Math.max(.5,Math.min(1,pl/760,(H-120)/700));SPC={x:pl*.5,y:H*.52,s:fs};
  SP.zk+=((TOOL==='lens'?ZOOM:1)-SP.zk)*.12;SP.vk+=((SP.vs?1:0)-SP.vk)*.12;if(SP.drag==null)SP.ry+=.004;
  const cx=SPC.x-110*fs*SP.vk,x=SP.x0+(cx-SP.x0)*sk,y=SP.y0+(SPC.y-SP.y0)*sk,sz=(SP.s0+(96*fs-SP.s0)*sk)*SP.zk*(1-.28*SP.vk);
  if(m.x){const h=m.habits[SP.hab]||m.habits[0],P=h.V.map(v=>{const q=rot(v,SP.rx,SP.ry+SP.seed);return[x+q[0]*sz,y+q[1]*sz,q[2]]});ink(g,h,P,1,1.5)}
  else{g.strokeStyle=`rgba(${INK},.5)`;g.setLineDash([2,3]);g.beginPath();g.arc(x,y,sz*.6,0,7);g.stroke();g.setLineDash([])}
  if(TOOL==='cmp'){const [rn,rh]=REF[REFI];lab(x,y+sz*1.6+24,`against ${rn.toLowerCase()} (${rh}):  ${cmpEl.querySelector('.vd').textContent}`,MUTE,sk,'italic 12px','center')}
  if(SP.vk>.02){const v=SP.vs||SP.vl;if(SP.vs)SP.vl=SP.vs;if(v){const x2=SPC.x+130*fs,s2=70*fs;g.globalAlpha=SP.vk;if(v.x){const h=v.habits[0],P=h.V.map(q=>{const r=rot(q,SP.rx,SP.ry+1.3);return[x2+r[0]*s2,y+r[1]*s2,r[2]]});ink(g,h,P,1,1.4)}g.globalAlpha=1;
    lab(x,y+sz*1.7,m.n,INK,SP.vk,'14px','center');lab(x2,y+sz*1.7,v.n,INK,SP.vk,'14px','center')}}}

/* ---------- the chip row: what you have narrowed to, always in view; plus clues and the shelf ---------- */
const chips=document.getElementById('chips'),cluep=document.getElementById('cluep');
const hName=h=>({2.5:'fingernail',3.5:'copper coin',5.5:'glass',6.5:'steel file',7:'quartz'})[h]||h;
function chipsDraw(){const C=[];
  if(SEL.hue){let [a,b]=SEL.hue;const na=hueName(a+3),nb=hueName(b-3);C.push(['hue',na===nb?na:`${na} → ${nb}`])}
  if(SEL.neu)C.push(['neu','white · grey · black']);
  SEL.places.forEach(p=>C.push(['pl:'+p,p]));
  if(SEL.lo>1||SEL.hi<10)C.push(['h',SEL.hi>=10?`harder than ${hName(SEL.lo)}`:SEL.lo<=1?`softer than ${hName(SEL.hi)}`:`Mohs ${SEL.lo}–${SEL.hi}`]);
  CL.st.forEach(x=>C.push(['st:'+x,x+' streak']));CL.cl.forEach(x=>C.push(['cl:'+x,x+' cleavage']));if(CL.met)C.push(['met',CL.met]);if(CL.acid)C.push(['acid','fizzes in acid']);CL.env.forEach(x=>C.push(['env:'+x,'forms in '+x]));
  const n=D.filter(fit).length;
  chips.innerHTML=C.map(([k,t])=>`<span class="chip" data-k="${k}">${t}<button title="remove">×</button></span>`).join('')+`<button id="addclue" class="${cluep.classList.contains('on')?'on':''}">+ clue</button>`
    +(C.length?`<span class="cnt">${n} of ${D.length}</span><button id="clearall">clear</button>`:'')+`<span class="sep"></span><button id="shelfb" class="${SHELF?'on':''}">${SHELF?'back to the '+(ARR==='colour'?'ring':ARR==='place'?'globe':'axis'):'put them on a shelf'}</button>`;
  chips.querySelectorAll('.chip button').forEach(b=>b.onclick=e=>{e.stopPropagation();const k=b.parentElement.dataset.k;
    if(k==='hue')SEL.hue=null;else if(k==='neu')SEL.neu=false;else if(k==='h'){SEL.lo=1;SEL.hi=10}else if(k==='met')CL.met=null;else if(k==='acid')CL.acid=false;
    else{const [a,v]=k.split(/:(.*)/);({pl:SEL.places,st:CL.st,cl:CL.cl,env:CL.env})[a].delete(v)}chipsDraw();clueDraw()});
  document.getElementById('addclue').onclick=e=>{e.stopPropagation();cluep.classList.toggle('on');clueDraw();chipsDraw()};
  const ca=document.getElementById('clearall');if(ca)ca.onclick=()=>{SEL.hue=null;SEL.neu=false;SEL.places.clear();SEL.lo=1;SEL.hi=10;CL.st.clear();CL.cl.clear();CL.env.clear();CL.met=null;CL.acid=false;chipsDraw();clueDraw()};
  document.getElementById('shelfb').onclick=()=>{SHELF=!SHELF;SHY.v=0;chipsDraw();sub()}}
function clueDraw(){if(!cluep.classList.contains('on'))return;const grp=(t,items,on,k)=>`<h4>${t}</h4><div class="ch2">${items.map(x=>`<button data-k="${k}" data-v="${x}" class="${on(x)?'on':''}">${x}</button>`).join('')}</div>`;
  cluep.innerHTML=grp('Streak',STS,x=>CL.st.has(x),'st')+grp('Lustre',['metallic','non-metallic'],x=>CL.met===x,'met')+grp('Cleavage',CLS,x=>CL.cl.has(x),'cl')+grp('Dilute acid',['fizzes'],()=>CL.acid,'acid')+grp('Forms in',ENVS,x=>CL.env.has(x),'env');
  cluep.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.stopPropagation();const k=b.dataset.k,v=b.dataset.v;
    if(k==='met')CL.met=CL.met===v?null:v;else if(k==='acid')CL.acid=!CL.acid;else{const S=CL[k];S.has(v)?S.delete(v):S.add(v)}clueDraw();chipsDraw()})}
document.addEventListener('click',e=>{if(!cluep.contains(e.target)&&cluep.classList.contains('on')){cluep.classList.remove('on');chipsDraw()}});

/* ---------- switching the layout ---------- */
function sub(){document.getElementById('sub').textContent=SHELF?'on a shelf, softest first':ARR==='colour'?'drag along the ring to pick colours':ARR==='place'?'drag to turn the earth · click places to pick them':'scroll to walk in · drag the rail’s ends to pick a range'}
function setArr(a){ARR=a;SHELF=false;document.querySelectorAll('#top [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===a));sub();chipsDraw();setCrumb()}
document.querySelectorAll('#top [data-v]').forEach(b=>b.onclick=()=>{closeSpec();setArr(b.dataset.v)});
document.getElementById('back').onclick=()=>dispatchEvent(new KeyboardEvent('keydown',{key:'Escape'}));

/* ---------- pointer ---------- */
const ang=(x,y)=>{const {cx0,cy0}=CG;return(Math.atan2(y-cy0,x-cx0)*180/Math.PI+90+360)%360};
cv.addEventListener('pointerdown',e=>{mx=e.clientX;my=e.clientY;
  if(SP){if(Math.hypot(mx-SPC.x,my-SPC.y)<120*SPC.s)SP.drag=[mx,my];return}
  if(hovO){press={k:'crystal',o:hovO,x:mx,y:my};return}
  if(SHELF)return;
  if(ARR==='colour'){const {cx0,cy0,R}=CG,d=Math.hypot(mx-cx0,my-cy0);if(Math.abs(d-R*1.12)<18){const a=ang(mx,my);RD={a0:a,acc:0,last:a,moved:false};return}if(d<R*.33){press={k:'neu',x:mx,y:my};return}}
  if(ARR==='place'){if(hovP){press={k:'pl',p:hovP,x:mx,y:my};return}const {cx0,cy0,R}=GLOBE();if(Math.hypot(mx-cx0,my-cy0)<R+10){G.drag=true;GT=null;G.x=mx;G.y=my;cv.style.cursor='grabbing'}return}
  if(ARR==='hard'&&HR&&Math.abs(mx-HR.rx)<24&&my>HR.y0-14&&my<HR.y1+14){const v=1+(my-HR.y0)/(HR.y1-HR.y0)*9,dl=Math.abs(HR.RY(SEL.lo)-my),dh=Math.abs(HR.RY(SEL.hi)-my);
    if(Math.min(dl,dh)<12){HD=dl<=dh?'lo':'hi';return}AX.t=Math.max(1,Math.min(10,v));return}});
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;
  if(SP&&SP.drag){SP.ry+=(mx-SP.drag[0])*.01;SP.rx=Math.max(-1.2,Math.min(1.2,SP.rx+(my-SP.drag[1])*.01));SP.drag=[mx,my];return}
  if(RD){const a=ang(mx,my),d=((a-RD.last+540)%360)-180;RD.acc+=d;RD.last=a;if(Math.abs(RD.acc)>6){RD.moved=true;SEL.hue=RD.acc>0?[RD.a0,a]:[a,RD.a0];chipsDraw()}return}
  if(G.drag){G.vl=(mx-G.x)*.25;G.va=(my-G.y)*.2;G.lon+=G.vl;G.lat=Math.max(-60,Math.min(60,G.lat+G.va));G.x=mx;G.y=my;return}
  if(HD){const v=Math.round((1+(my-HR.y0)/(HR.y1-HR.y0)*9)*2)/2;if(HD==='lo')SEL.lo=Math.max(1,Math.min(v,SEL.hi));else SEL.hi=Math.min(10,Math.max(v,SEL.lo));chipsDraw();return}});
addEventListener('pointerup',e=>{if(SP&&SP.drag){SP.drag=null;return}
  if(press){const moved=Math.hypot(mx-press.x,my-press.y)>5;
    if(press.k==='crystal'&&!moved)openSpec(press.o);
    if(press.k==='pl'&&!moved){const n=press.p.n;SEL.places.has(n)?SEL.places.delete(n):SEL.places.add(n);chipsDraw()}
    if(press.k==='neu'&&!moved){SEL.neu=!SEL.neu;chipsDraw()}press=null}
  if(RD){if(!RD.moved){const a=RD.a0;if(SEL.hue&&hueIn(a))SEL.hue=null;else SEL.hue=[(a-18+360)%360,(a+18)%360];chipsDraw()}RD=null}
  if(G.drag){G.drag=false;cv.style.cursor=''}HD=null});
addEventListener('wheel',e=>{if(SP){e.preventDefault();return}if(e.target!==cv)return;if(SHELF){SHY.v+=e.deltaY;return}if(ARR==='hard'){e.preventDefault();AX.t=Math.max(.6,Math.min(10,AX.t+(e.deltaY+e.deltaX)*.003))}},{passive:false});
addEventListener('keydown',e=>{if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
  if(e.key==='Escape'){if(cluep.classList.contains('on')){cluep.classList.remove('on');chipsDraw();return}if(SP&&TOOL){setTool(TOOL);return}if(SP){closeSpec();return}if(SHELF){SHELF=false;chipsDraw();sub();return}}
  if(ARR==='hard'&&!SP&&!SHELF&&(e.key==='ArrowDown'||e.key==='ArrowUp')){AX.t=Math.max(.6,Math.min(10,AX.t+(e.key==='ArrowDown'?.5:-.5)));e.preventDefault()}
  if(e.key==='/'){e.preventDefault();qEl.focus()}});

/* ---------- search picks ---------- */
function pick(r){if(!r)return;const b=qEl.getBoundingClientRect();qEl.value='';QR=[];qEl.blur();drawFind();
  if(r.cf){closeSpec();setArr('colour');if(['white / colourless','grey','black'].includes(r.cf))SEL.neu=true;else SEL.hue=FAMH[r.cf].slice();chipsDraw();return}
  if(r.pl){closeSpec();setArr('place');SEL.places.add(r.pl.n);GT={lon:r.pl.lon,lat:-r.pl.lat};FLASHP=r.pl;FLASHT=performance.now();chipsDraw();return}
  closeSpec();openSpec({m:r.m,x:b.left+b.width/2,y:b.bottom+30,s:12,seed:0},'search')}

/* ---------- frame ---------- */
function loop(t){g.clearRect(0,0,W,H);
  if(D.length){if(!SP)pickHover();
    if(!SHELF){if(ARR==='colour')drawRingRuler(t);else if(ARR==='place')drawGlobe(t);else drawHardAxis(t)}
    drawCrystals(t);
    if(FLASHP&&ARR==='place'){const k=Math.max(0,1-(t-FLASHT)/3500);if(k>0&&FLASHP.sz>.05){g.strokeStyle=`rgba(${INK},${k})`;g.beginPath();g.arc(FLASHP.sx,FLASHP.sy,14+6*Math.sin(t/200),0,7);g.stroke();lab(FLASHP.sx+22,FLASHP.sy+4,FLASHP.n,INK,k,'13px')}}
    if(SP)drawSpec(t)}
  drawLoader(t);requestAnimationFrame(loop)}
Promise.all([fetch('minerals-v14.json').then(r=>r.json()),fetch('land.json').then(r=>r.json())]).then(([d,l])=>{setTimeout(()=>{D=d;LAND=l;
  O=D.map(m=>({m,x:W/2,y:H/2,s:2,a:0,tx:W/2,ty:H/2,ts:2,ta:0,lift:0,seed:Math.random()*6,gc:[]}));LOADEND=performance.now();store('mn-seen',1);
  addEventListener('resize',rs);rs();O.forEach(o=>{o.x=W/2;o.y=H/2-10});setArr(['colour','place','hard'].includes(location.hash.slice(1))?location.hash.slice(1):'colour')},Math.max(0,(store('mn-seen')?0:1300)-(performance.now()-LOAD0)))});
rs();requestAnimationFrame(loop);

</script></body></html>
