<style>

  body:is([data-theme=sediment],[data-theme=cards],[data-theme=darkroom]) .crow .sl{font-style:italic}

  body[data-theme=paper] #card.flip .b>*:nth-child(3){transition-delay:.49s} body[data-theme=paper] #card.flip .b>*:nth-child(4){transition-delay:.56s}

<body>
<canvas id="c"></canvas>
<div id="tabs"></div>
<svg width="0" height="0" style="position:absolute"><defs><radialGradient id="shade" cx=".36" cy=".32" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient></defs></svg>
<aside id="side"><button id="sideBtn" aria-label="Expand"><i></i><i></i><i></i><i></i></button><div id="list"></div></aside>
<div id="labels"></div>

<div id="focus"><svg id="oring"><circle pathLength="1"/></svg><div id="card"><div class="f"><img alt=""></div><div class="b"></div></div><div id="cap"></div></div>

<script>
/* ============================================================
   The axis is time, everywhere.
   Level 1 — a flat disc of the world seen from the pole. Direction = where the
     object comes from (longitude). Turning shows everything; settled, only the
     chosen hemisphere (two quarters) stays lit.
   Level 2 — inside a hemisphere the cross means material:
     left transformed · right formed · up rigid · down flexible.
     Scroll travels through centuries; drag pans; double-click or ctrl-scroll
     moves in; click an object to hold it, click again for its label.
   Data and images: The Met, Open Access (public domain).
   ============================================================ */
const cv=document.getElementById('c'),g=cv.getContext('2d');let W,H,S;
{const ft=g.fillText.bind(g);g.fillText=(t,x,y)=>ft(TH.upper?String(t).toUpperCase():t,x,y)}
function resize(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height=H+'px';g.setTransform(d,0,0,d,0,0);S=Math.min(W,H)*.36;laid=false}
let laid=false;resize();addEventListener('resize',resize);

const CENT=['1900s','1800s','1700s','1600s','1500s','1400s','1300s','1000–1300','500–1000','1–500','500 BCE','before 500 BCE'];
const QUART=[{n:'0°–90°E',s:'Europe · Africa · West Asia'},{n:'90°–180°E',s:'East Asia · Oceania'},{n:'180°–90°W',s:'Pacific · Western Americas'},{n:'90°W–0°',s:'The Americas · Atlantic'}];
const MATS=['Metal, ceramic, glass','Stone, wood, ivory','Paper, felt','Silk, cotton, textile'];
const COMBO=['transformed + rigid','formed + rigid','transformed + flexible','formed + flexible'];
// the quarters are named by the two axes that make them; the materials are only examples of what lives there
const NAMES=[];
const AXN=['Rigid · Transformed','Rigid · Formed','Flexible · Transformed','Flexible · Formed'];
const EXS=MATS.map(m=>m.split(', '));
const MWORDS=['steel','iron','gold','silver','bronze','copper','brass','ceramic','terracotta','porcelain','earthenware','glass','stone','marble','jade','travertine','greenstone','wood','ivory','bone','shell','lacquer','leather','paper','ink','silk','cotton','velvet','felt','textile','fiber','thread'];
function matsNow(q){const c=Math.round(depth),cnt={};mine().filter(p=>p.mat===q&&p.cen===c).forEach(p=>{const m=(p.m||'').toLowerCase();MWORDS.forEach(w=>{if(new RegExp('\\b'+w+'\\b').test(m))cnt[w]=(cnt[w]||0)+1})});
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]);return top.length?top.join(' · '):'—'}
