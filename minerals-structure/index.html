<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Minerals — structure</title>
<style>
:root{--bg:#f4f3ef;--ink:#1c1b18;--mute:#77736b;--faint:#c4c0b6;--hi:#1c1b18}
*{margin:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:220px 1fr 340px;height:100%}
#levels{border-right:1px solid #e2dfd8;padding:22px 0}
#levels button{all:unset;display:block;box-sizing:border-box;width:100%;padding:10px 22px;cursor:pointer;color:var(--mute)}
#levels button b{display:block;font-weight:500;color:var(--ink);opacity:.55}
#levels button.on{background:#ebe9e3}#levels button.on b{opacity:1}
#levels .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:0 22px 8px}
#stage{position:relative}
#stage svg{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
#stage .hint{position:absolute;left:24px;bottom:18px;color:var(--mute);font-size:12px}
#info{border-left:1px solid #e2dfd8;padding:22px 24px;overflow:auto}
#info h2{font-size:18px;font-weight:500;margin-bottom:4px}
#info .sub{color:var(--mute);margin-bottom:18px}
#info h3{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:500;margin:18px 0 6px}
#info ul{list-style:none;padding:0}#info li{padding:4px 0;border-top:1px solid #ebe8e1}
#info li i{font-style:normal;color:var(--mute)}
#info .tag{display:inline-block;border:1px solid var(--faint);border-radius:10px;padding:0 7px;margin:2px 4px 2px 0;font-size:11px;color:var(--mute)}
text{font:11px ui-sans-serif,system-ui,sans-serif;fill:var(--mute)}
text.ax{fill:var(--ink);font-weight:500}
.ln{stroke:var(--ink);fill:none}
</style></head><body>
<div id="app">
  <nav id="levels"><div class="k">Levels</div></nav>
  <div id="stage"><svg id="g"></svg><div class="hint" id="hint"></div></div>
  <aside id="info"></aside>
</div>
<script>
// ---------- the structure: one axis grammar repeated at every scale, each level zooms into a part of the one above ----------
const L=[
 {k:'L0',n:'Earth',sub:'Where minerals were first found',
  axes:[['Longitude','the top bar · 4 hemispheres'],['Latitude','north ↔ south on the globe'],['Depth (rail)','Mohs hardness 1–10, chosen before entering']],
  shows:['Every mineral as a point at its type locality','Clusters: most were named in Europe','Hover a point: name + where'],
  act:['Drag: spin the globe (rotation axis = the earth’s axis)','Top bar: turn to a hemisphere','Rail: pick a hardness layer → Enter dives into the cube'],
  comp:['Loader (sediment settles into the globe)','Navigation · top bar','Navigation · rail','Tooltip'],
  hint:'drag to spin'},
 {k:'L1',n:'Strata',sub:'One hemisphere, sorted by what minerals are',
  axes:[['X','Silicate ↔ Other (chemistry)'],['Y','Symmetric ↔ Asymmetric (crystal)'],['Z (depth)','Mohs hardness: soft in front, hard at the back']],
  shows:['Each hardness layer is a frame; specimens sit in it','4 quadrants = 4 kinds of mineral, with counts','Reference mineral on each layer (talc … diamond)'],
  act:['Front / Side / Top: flip the cube to read the depth axis','Scroll or drag the rail: move through layers','Tap a quadrant: zoom into it (→ L2)','Filter panel: narrow what is shown'],
  comp:['Navigation (3 bars)','Menu · quadrant','Slider · hardness (stepped)','Selector · crystal system (radio)','Toggle · polarised light','Badge · count'],
  hint:'drag to turn · Front / Side / Top'},
 {k:'L2',n:'Quadrant',sub:'One kind, the axes get finer',
  axes:[['X','chemical class: oxide · sulfide · carbonate · sulfate · phosphate · halide · borate'],['Y','the 7 crystal systems as ticks'],['Z (depth)','hardness, now continuous (3.25, 3.5 …)']],
  shows:['Each specimen as its crystal-system glyph + photo','Neighbours: same class, close hardness','Mini-map of where you are in L1'],
  act:['Pinch / wheel: zoom the plane','Drag an axis end: stretch that axis to spread crowded points','Hover: tooltip · click: open specimen (→ L3)'],
  comp:['List (specimens of this class, synced with the plane)','Tooltip','Badges · hardness, class'],
  hint:'wheel to zoom'},
 {k:'L3',n:'Specimen',sub:'One mineral, its own crystal axes',
  axes:[['a · b · c','the crystal’s own axes; their lengths and angles are its crystal system'],['Hardness ring','where it sits on 1–10'],['Locality pin','link back to L0']],
  shows:['Photo ↔ crystal wireframe','Properties: hardness, class, system, formula, first found','Cleavage planes'],
  act:['Drag: rotate the crystal on its own a·b·c axes','Toolbar: hand lens (zoom), streak, scale, polarise','Button: cleave along its planes · collect'],
  comp:['Toolbar (field tools)','Buttons · cleave, collect','Badges','Tooltip on each axis'],
  hint:'drag to rotate the crystal'},
 {k:'L4',n:'Drawer · Notebook',sub:'What you collected, and your notes',
  axes:[['Rows','your specimens, sorted by any axis you used (where, hardness, kind)'],['Sort control','re-sort = pick which axis the list follows']],
  shows:['Collected specimens as drawer slots','Your field notes per specimen'],
  act:['Sort by an axis','Write a note: locality, date, what you saw','Tap a slot: back to L3'],
  comp:['List · drawer','Text input · field notebook','Menu · sort by axis','Buttons'],
  hint:''}];
let cur=0,rx=-.35,ry=.55,zoom=1,drag=null;
const nav=document.getElementById('levels');
L.forEach((l,i)=>{const b=document.createElement('button');b.innerHTML=`<b>${l.k} · ${l.n}</b>${l.sub}`;b.onclick=()=>go(i);nav.appendChild(b)});
function go(i){cur=i;rx=-.35;ry=.55;zoom=1;[...nav.querySelectorAll('button')].forEach((b,k)=>b.classList.toggle('on',k===i));
  const l=L[i];document.getElementById('hint').textContent=l.hint;
  document.getElementById('info').innerHTML=`<h2>${l.k} · ${l.n}</h2><div class="sub">${l.sub}</div>
  <h3>Axes at this level</h3><ul>${l.axes.map(a=>`<li><b>${a[0]}</b> <i>— ${a[1]}</i></li>`).join('')}</ul>
  <h3>What it shows</h3><ul>${l.shows.map(s=>`<li>${s}</li>`).join('')}</ul>
  <h3>How you use the axes</h3><ul>${l.act.map(s=>`<li>${s}</li>`).join('')}</ul>
  <h3>Components here</h3>${l.comp.map(c=>`<span class="tag">${c}</span>`).join('')}`}
// ---------- tiny 3D ----------
const E=(t,a,i='')=>`<${t} ${Object.entries(a).map(([k,v])=>`${k}="${v}"`).join(' ')}>${i}</${t}>`;
function P(v){const [x,y,z]=v,cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx);let X=x*cy+z*sy,Z=-x*sy+z*cy,Y=y*cx-Z*sx;Z=y*sx+Z*cx;const st=document.getElementById('stage'),s=Math.min(st.clientWidth,st.clientHeight)*(cur===1?.24:.3)*zoom,f=6/(6+Z);return[st.clientWidth/2+X*s*f,st.clientHeight/2+Y*s*f]}
const seg=(a,b,o={})=>{const p=P(a),q=P(b);return E('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],class:'ln','stroke-opacity':o.op??.5,...(o.dash?{'stroke-dasharray':o.dash}:{})})};
const lab=(v,t,cls='')=>{const p=P(v);return E('text',{x:p[0]+6,y:p[1]-6,class:cls},t)};
const dot=(v,r=2.5,op=.8)=>{const p=P(v);return E('circle',{cx:p[0],cy:p[1],r,fill:'var(--ink)','fill-opacity':op})};
const rnd=(s=>()=>(s=(s*16807)%2147483647)/2147483647)(7);const PTS=Array.from({length:90},()=>[rnd(),rnd(),rnd(),rnd()]);
function draw(){let o='';const l=cur;
 if(l===0){ // globe: meridians + equator, points at localities, the hardness rail as a separate axis
  for(let m=0;m<12;m++){let d='';for(let k=0;k<=40;k++){const t=-Math.PI/2+Math.PI*k/40,a=m*Math.PI/6,p=P([Math.cos(t)*Math.cos(a),Math.sin(t),Math.cos(t)*Math.sin(a)]);d+=(k?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}o+=E('path',{d,class:'ln','stroke-opacity':m%3?.1:.3})}
  let d='';for(let k=0;k<=60;k++){const a=Math.PI*2*k/60,p=P([Math.cos(a),0,Math.sin(a)]);d+=(k?'L':'M')+p[0]+' '+p[1]}o+=E('path',{d,class:'ln','stroke-opacity':.35});
  o+=seg([0,-1.3,0],[0,1.3,0],{op:.6})+lab([0,-1.3,0],'rotation axis','ax');
  PTS.forEach(q=>{const lon=(q[0]<.6?q[0]*.6-.1:q[0]*2-1)*Math.PI,lat=(q[1]*.9-.2)*Math.PI/2,v=[Math.cos(lat)*Math.cos(lon),-Math.sin(lat),Math.cos(lat)*Math.sin(lon)];o+=dot(v,2,.6)});
  o+=lab([1.05,0,0],'equator · longitude →','ax');
 }
 if(l===1){ // cube: X chemistry, Y symmetry, Z hardness layers
  for(let k=0;k<10;k++){const z=-1+k*2/9,s=1-k*.03,op=k===3?.8:.18;const c=[[-s,-s,z],[s,-s,z],[s,s,z],[-s,s,z]];for(let j=0;j<4;j++)o+=seg(c[j],c[(j+1)%4],{op});if(k%3===0||k===9)o+=lab([-s,-s,z],(k+1)+' '+['talc','gypsum','calcite','fluorite','apatite','orthoclase','quartz','topaz','corundum','diamond'][k])}
  o+=seg([-1.3,0,-1],[1.3,0,-1],{op:.8})+seg([0,-1.3,-1],[0,1.3,-1],{op:.8})+seg([0,0,-1.3],[0,0,1.3],{op:.8,dash:'3 4'});
  o+=lab([-1.3,0,-1],'Silicate','ax')+lab([1.15,0,-1],'Other','ax')+lab([0,-1.35,-1],'Symmetric','ax')+lab([0,1.4,-1],'Asymmetric','ax')+lab([0,0,1.35],'Z · harder','ax');
  PTS.forEach(q=>o+=dot([q[0]*1.8-.9,q[1]*1.8-.9,-1+Math.floor(q[2]*10)*2/9],2,.4));
 }
 if(l===2){ // one quadrant flattened: X = classes, Y = 7 systems, Z = continuous hardness
  const C=['oxide','sulfide','carbonate','sulfate','phosphate','halide','borate'],S=['cubic','tetragonal','hexagonal','trigonal','orthorhombic','monoclinic','triclinic'];
  C.forEach((c,i)=>{const x=-1+i*2/6;o+=seg([x,-1,0],[x,1,0],{op:.12})+lab([x,1.12,0],c)});S.forEach((s,i)=>{const y=-1+i*2/6;o+=seg([-1,y,0],[1,y,0],{op:.12})+lab([-1.45,y,0],s)});
  o+=seg([-1.1,1.05,0],[1.15,1.05,0],{op:.8})+seg([-1.1,-1.1,0],[-1.1,1.05,0],{op:.8})+seg([-1.1,1.05,0],[-1.1,1.05,1.2],{op:.8,dash:'3 4'})+lab([-1.1,1.05,1.2],'Z · hardness (continuous)','ax');
  PTS.slice(0,45).forEach(q=>{const v=[-1+Math.round(q[0]*6)*2/6+(q[3]-.5)*.12,-1+Math.round(q[1]*6)*2/6,(q[2]-.5)*.6];const p=P(v);o+=E('rect',{x:p[0]-3,y:p[1]-3,width:6,height:6,class:'ln','stroke-opacity':.6})});
 }
 if(l===3){ // a crystal and its own a, b, c axes (monoclinic: beta ≠ 90°)
  const a=[1.1,0,0],b=[0,-.8,0],c=[.35,0,.9];const add=(...v)=>v.reduce((s,w)=>s.map((x,i)=>x+w[i]),[0,0,0]),neg=v=>v.map(x=>-x),h=v=>v.map(x=>x/2);
  const corners=[];for(const i of[-1,1])for(const j of[-1,1])for(const k of[-1,1])corners.push(add(h(a).map(x=>x*i),h(b).map(x=>x*j),h(c).map(x=>x*k)));
  [[0,1],[0,2],[0,4],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7]].forEach(([i,j])=>o+=seg(corners[i],corners[j],{op:.7}));
  [['a',a],['b',b],['c',c]].forEach(([n,v])=>{o+=seg(neg(v).map(x=>x*.9),v.map(x=>x*.9),{op:.9,dash:'2 3'})+lab(v.map(x=>x*.92),n,'ax')});
  o+=seg(corners[0],corners[3],{op:.35,dash:'1 3'})+lab(corners[3],'cleavage plane');
 }
 if(l===4){ // drawer: rows sorted by one chosen axis
  const st=document.getElementById('stage'),w=st.clientWidth,hh=st.clientHeight;for(let r=0;r<6;r++){const y=hh*.22+r*54;o+=E('rect',{x:w*.18,y,width:w*.64,height:44,class:'ln','stroke-opacity':.3,rx:3})+E('rect',{x:w*.18+10,y:y+8,width:28,height:28,class:'ln','stroke-opacity':.5})+E('text',{x:w*.18+52,y:y+20,class:'ax'},'Specimen '+(r+1))+E('text',{x:w*.18+52,y:y+34},'note…')+E('text',{x:w*.82-90,y:y+26},'hardness '+(2+r))}
  o+=E('text',{x:w*.18,y:hh*.22-14,class:'ax'},'sort by:  where · hardness · kind');
 }
 document.getElementById('g').innerHTML=o;requestAnimationFrame(draw)}
const g=document.getElementById('g');
g.onpointerdown=e=>{drag=[e.clientX,e.clientY,rx,ry];g.setPointerCapture(e.pointerId)};
g.onpointermove=e=>{if(!drag)return;ry=drag[3]+(e.clientX-drag[0])*.008;rx=Math.max(-1.4,Math.min(1.4,drag[2]+(e.clientY-drag[1])*.008))};
g.onpointerup=()=>drag=null;
g.onwheel=e=>{e.preventDefault();zoom=Math.max(.5,Math.min(2.5,zoom*(e.deltaY>0?.92:1.08)))};
go(0);draw();
</script></body></html>
